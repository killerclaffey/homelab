stages:
  - test

gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        gitleaks detect --source . --verbose --redact --log-opts="$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"
      else
        gitleaks detect --source . --verbose --redact --log-opts="HEAD~1..HEAD"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

gitops-ci:
  stage: test
  image:
    name: registry.apps.okd.claffey.cloud/rclaffey/homelab/k8s-gitops-ci:latest
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
    GITLAB_HOST: "${CI_SERVER_HOST}"
  script:
    - k8s-gitops-ci pipeline --assume-openshift --comment
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
