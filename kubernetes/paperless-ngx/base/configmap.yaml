apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-ngx-config
  namespace: paperless-ngx
data:
  PAPERLESS_URL: "https://paperless.apps.okd.claffey.cloud"
  PAPERLESS_ALLOWED_HOSTS: "paperless.apps.okd.claffey.cloud,*"
  PAPERLESS_DBENGINE: "postgresql"
  PAPERLESS_DBPORT: "5432"
  PAPERLESS_DBSSLMODE: "prefer"
  PAPERLESS_REDIS: "redis://paperless-ngx-valkey:6379"
  PAPERLESS_TIME_ZONE: "America/New_York"
  PAPERLESS_OCR_LANGUAGE: "eng"
  # Polling is required because inotify events do not propagate over NFS mounts
  PAPERLESS_CONSUMER_POLL: "60"
  PAPERLESS_TIKA_ENABLED: "0"
  PAPERLESS_DATA_DIR: "/usr/src/paperless/data"
  PAPERLESS_MEDIA_ROOT: "/usr/src/paperless/media"
  PAPERLESS_CONSUMPTION_DIR: "/usr/src/paperless/consume"
  PAPERLESS_EXPORT_DIR: "/usr/src/paperless/export"
  # Explicitly allow world-writable /run for non-root execution under Kubernetes / OpenShift
  S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
