apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-boot-network-gate
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
        - name: kubelet-network-gate.service
          enabled: true
          contents: |
            [Unit]
            Description=Pre-start network gate for Kubelet
            Wants=NetworkManager-wait-online.service
            After=NetworkManager-wait-online.service
            Before=kubelet.service

            [Service]
            Type=oneshot
            TimeoutStartSec=180
            RemainAfterExit=yes
            ExecStart=/usr/local/bin/kubelet-prestart-gate.sh

            [Install]
            RequiredBy=kubelet.service
    storage:
      files:
        - path: /usr/local/bin/kubelet-prestart-gate.sh
          mode: 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-boot-network-gate
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
        - name: kubelet-network-gate.service
          enabled: true
          contents: |
            [Unit]
            Description=Pre-start network and storage gate for Worker Kubelet
            Wants=NetworkManager-wait-online.service
            After=NetworkManager-wait-online.service
            Before=kubelet.service

            [Service]
            Type=oneshot
            TimeoutStartSec=240
            RemainAfterExit=yes
            ExecStart=/usr/local/bin/kubelet-prestart-gate.sh

            [Install]
            RequiredBy=kubelet.service
    storage:
      files:
        - path: /usr/local/bin/kubelet-prestart-gate.sh
          mode: 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
