apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
  name: gitlab
  namespace: gitlab-system
spec:
  chart:
    values:
      certmanager:
        install: false
      gitlab:
        gitaly:
          git:
            config:
              - key: safe.directory
                value: "*"
          persistence:
            size: 50Gi
            storageClass: truenas-nfs-bulk
        gitlab-shell:
          maxReplicas: 1
          minReplicas: 1
          service:
            nodePort: 32022
            type: NodePort
        sidekiq:
          resources:
            limits:
              cpu: "1"
              memory: 2.0G
            requests:
              cpu: 100m
              memory: 600M
        toolbox:
          backups:
            objectStorage:
              config:
                key: config
                secret: gitlab-object-storage-s3cmd
        webservice:
          maxReplicas: 2
          minReplicas: 1
          resources:
            limits:
              cpu: "1"
              memory: 4.5G
            requests:
              cpu: 300m
              memory: 1.5G
      gitlab-runner:
        install: true
      global:
        appConfig:
          object_store:
            connection:
              key: config
              secret: gitlab-object-storage
            enabled: true
            proxy_download: true
        gatewayApi:
          configureCertmanager: false
          enabled: false
          installEnvoy: false
        hosts:
          domain: apps.okd.claffey.cloud
          https: true
        ingress:
          annotations: {}
          class: openshift-default
          configureCertmanager: false
          enabled: true
          provider: openshift
        psql:
          host: gitlab-rails-db-rw.gitlab-system.svc
          password:
            key: password
            secret: gitlab-rails-db-app
        redis:
          auth:
            enabled: false
          host: gitlab-valkey.gitlab-system.svc
        shell:
          port: 22
        smtp:
          enabled: false
        storageClass: truenas-nfs-bulk
      nginx-ingress:
        enabled: false
      prometheus:
        install: false
      registry:
        storage:
          key: config
          redirect:
            disable: true
          secret: gitlab-registry-storage
    version: 10.4.6
