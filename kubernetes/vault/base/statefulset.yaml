apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:2.0.3
          command:
            - /bin/vault
          args:
            - server
            - -config=/vault/config/vault.hcl
          ports:
            - containerPort: 8200
              name: http
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
            - name: vault-config
              mountPath: /vault/config
        - name: auto-unseal
          image: docker.io/hashicorp/vault:2.0.3
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting Vault Auto-Unseal daemon..."
              while true; do
                SEALED=$(vault status -address=http://127.0.0.1:8200 2>&1 | grep -i "Sealed" | awk '{print $2}')
                if [ "$SEALED" = "true" ] && [ -n "$UNSEAL_KEY" ]; then
                  echo "Vault is sealed! Attempting auto-unseal..."
                  vault operator unseal -address=http://127.0.0.1:8200 "$UNSEAL_KEY"
                fi
                sleep 15
              done
          envFrom:
            - secretRef:
                name: vault-unseal-keys
      volumes:
        - name: vault-config
          configMap:
            name: vault-config
        - name: vault-data
          persistentVolumeClaim:
            claimName: vault-data
