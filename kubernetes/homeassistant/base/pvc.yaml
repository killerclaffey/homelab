---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app.kubernetes.io/instance: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: tns-nvmeof-nvme
  volumeMode: Filesystem
