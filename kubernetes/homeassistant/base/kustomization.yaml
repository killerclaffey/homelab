---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant
resources:
  - namespace.yaml
  - limit-range.yaml
  - service-account.yaml
  - pvc.yaml
  - service.yaml
  - network-policy.yaml
  - statefulset.yaml
  - velero.yaml
  - service-monitor.yaml
    # - secret.yaml

configMapGenerator:
  - files:
      - ./config/configuration.yaml
    name: homeassistant-config
    options:
      disableNameSuffixHash: true
