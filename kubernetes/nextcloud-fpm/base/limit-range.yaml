apiVersion: v1
kind: LimitRange
metadata:
  name: nextcloud-lr
  namespace: nextcloud-fpm
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
        ephemeral-storage: 1Gi
      defaultRequest:
        cpu: 25m
        memory: 64Mi
        ephemeral-storage: 128Mi
