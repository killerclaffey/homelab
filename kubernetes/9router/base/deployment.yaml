apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: 9router
    app.kubernetes.io/name: 9router
  name: 9router
  namespace: 9router
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: 9router
      app.kubernetes.io/name: 9router
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: 9router
        app.kubernetes.io/name: 9router
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: 9router
          image: docker.io/decolua/9router:0.5.95@sha256:4316fefb95ea642d57db885d906b1227b1768b15ac5def314621fd781da7b3f1
          imagePullPolicy: IfNotPresent
          command: ["node", "custom-server.js"]
          env:
            - name: PORT
              value: "20128"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: DATA_DIR
              value: "/app/data"
            - name: HOME
              value: "/app/data"
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 9router-secret
                  key: initial-password
                  optional: true
          ports:
            - name: http
              containerPort: 20128
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 9router-data
