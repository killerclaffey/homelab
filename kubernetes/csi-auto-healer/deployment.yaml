apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-auto-healer
  namespace: csi-auto-healer
  labels:
    app: csi-auto-healer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csi-auto-healer
  template:
    metadata:
      labels:
        app: csi-auto-healer
    spec:
      serviceAccountName: csi-auto-healer-sa
      containers:
      - name: healer
        image: alpine:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          echo "Installing runtime dependencies..."
          apk add --no-cache curl python3 jq
          
          echo "Installing kubectl binary..."
          curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          mv kubectl /usr/local/bin/
          
          echo "Running auto-healer..."
          python3 /app/healer.py
        ports:
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /app
          name: script-vol
      volumes:
      - name: script-vol
        configMap:
          name: csi-auto-healer-script
