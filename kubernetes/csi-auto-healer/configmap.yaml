apiVersion: v1
kind: ConfigMap
metadata:
  name: csi-auto-healer-script
  namespace: csi-auto-healer
data:
  healer.py: |
    import json
    import subprocess
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class WebhookHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers['Content-Length'])
            post_data = self.rfile.read(content_length)
            
            try:
                payload = json.loads(post_data.decode('utf-8'))
                print("Received webhook payload:")
                print(json.dumps(payload, indent=2))
                
                alerts = payload.get('alerts', [])
                for alert in alerts:
                    status = alert.get('status')
                    # We only act on firing alerts, not resolved ones
                    if status != 'firing':
                        continue
                        
                    labels = alert.get('labels', {})
                    alertname = labels.get('alertname')
                    
                    if alertname == 'CSIStuckVolumeAttachment':
                        attachment = labels.get('volumeattachment')
                        node = labels.get('node')
                        
                        print(f"Processing CSIStuckVolumeAttachment alert for volumeattachment '{attachment}' on node '{node}'")
                        
                        # 1. Force detach volume attachment if specified
                        if attachment:
                            print(f"Force detaching volume attachment {attachment} by removing finalizers...")
                            cmd = ["kubectl", "patch", "volumeattachment", attachment, "-p", '{"metadata":{"finalizers":[]}}', "--type=merge"]
                            res = subprocess.run(cmd, capture_output=True, text=True)
                            if res.returncode == 0:
                                print(f"Successfully patched volumeattachment {attachment}. Output: {res.stdout.strip()}")
                            else:
                                print(f"Failed to patch volumeattachment {attachment}. Error: {res.stderr.strip()}", file=sys.stderr)
                        
                        # 2. Check and taint node if it is NotReady
                        if node:
                            print(f"Checking if node {node} is NotReady...")
                            check_cmd = ["kubectl", "get", "node", node, "-o", "jsonpath={.status.conditions[?(@.type=='Ready')].status}"]
                            check_res = subprocess.run(check_cmd, capture_output=True, text=True)
                            
                            if check_res.returncode == 0 and check_res.stdout.strip() == "False":
                                print(f"Node {node} is confirmed NotReady. Applying out-of-service taint to force reschedule workloads...")
                                taint_cmd = ["kubectl", "taint", "nodes", node, "node.kubernetes.io/out-of-service=nodeshutdown:NoExecute", "--overwrite"]
                                taint_res = subprocess.run(taint_cmd, capture_output=True, text=True)
                                if taint_res.returncode == 0:
                                    print(f"Successfully applied taint to node {node}. Output: {taint_res.stdout.strip()}")
                                else:
                                    print(f"Failed to taint node {node}. Error: {taint_res.stderr.strip()}", file=sys.stderr)
                            else:
                                print(f"Node {node} is Ready or check failed. Skipping taint application. Status: {check_res.stdout.strip()}")
                                
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK")
            except Exception as e:
                print(f"Error handling webhook request: {e}", file=sys.stderr)
                self.send_response(500)
                self.end_headers()
                self.wfile.write(str(e).encode('utf-8'))

    def run(server_class=HTTPServer, handler_class=WebhookHandler, port=8080):
        server_address = ('', port)
        httpd = server_class(server_address, handler_class)
        print(f"CSI Auto-Healer server starting on port {port}...")
        httpd.serve_forever()

    if __name__ == '__main__':
        run()
