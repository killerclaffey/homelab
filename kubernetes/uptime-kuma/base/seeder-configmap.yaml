apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-seeder
  namespace: uptime-kuma
data:
  seed_monitors.sh: |
    #!/bin/sh
    DB_PATH="/app/data/kuma.db"

    echo "Starting background monitor seeder..."

    # Wait for the DB file to exist and the monitor table to be created
    until sqlite3 "$DB_PATH" "SELECT 1 FROM monitor LIMIT 1;" >/dev/null 2>&1; do
      echo "Waiting for monitor table to be initialized..."
      sleep 5
    done

    echo "Monitor table ready. Seeding monitors..."

    seed_monitor() {
      NAME="$1"
      URL="$2"
      IGNORE_TLS="${3:-0}"
      CODES="${4:-[\"200-299\"]}"
      
      # Insert if not exists
      sqlite3 "$DB_PATH" "INSERT INTO monitor (name, active, interval, url, type, ignore_tls, accepted_statuscodes_json, user_id) SELECT '$NAME', 1, 60, '$URL', 'http', $IGNORE_TLS, '$CODES', 1 WHERE NOT EXISTS (SELECT 1 FROM monitor WHERE name='$NAME');"
      
      # Update if exists
      sqlite3 "$DB_PATH" "UPDATE monitor SET url='$URL', interval=60, ignore_tls=$IGNORE_TLS, accepted_statuscodes_json='$CODES', user_id=1 WHERE name='$NAME';"
    }

    seed_monitor "ArgoCD" "https://argocd-server-argocd.apps.okd.claffey.cloud"
    seed_monitor "Mealie" "https://mealie-mealie.apps.okd.claffey.cloud"
    seed_monitor "Immich" "https://images.apps.okd.claffey.cloud"
    seed_monitor "GitLab" "https://gitlab.apps.okd.claffey.cloud"
    seed_monitor "Uptime Kuma" "http://localhost:3001"
    seed_monitor "Bikely Production" "https://bikely.pro" 1
    seed_monitor "Bikely Dev" "https://devbikely.claffey.cloud" 1
    seed_monitor "Grafana" "https://grafana.apps.okd.claffey.cloud"
    seed_monitor "Prometheus" "https://prometheus.apps.okd.claffey.cloud" 1
    seed_monitor "Alertmanager" "https://alertmanager.apps.okd.claffey.cloud" 1
    seed_monitor "MinIO" "https://minio.apps.okd.claffey.cloud" 1 '["200-299","403"]'
    seed_monitor "GitLab Registry" "https://registry.apps.okd.claffey.cloud" 1
    seed_monitor "OpenShift Console" "https://console-openshift-console.apps.okd.claffey.cloud" 1
    seed_monitor "Vault" "https://vault-vault.apps.okd.claffey.cloud" 1

    # Seed Status Page (slug: default)
    sqlite3 "$DB_PATH" "INSERT INTO status_page (id, slug, title, description, icon, theme, published) SELECT 1, 'default', 'HomeLab Status', 'Real-time monitoring of HomeLab services and infrastructure.', '', 'dark', 1 WHERE NOT EXISTS (SELECT 1 FROM status_page WHERE slug='default');"

    # Seed Groups
    sqlite3 "$DB_PATH" "INSERT INTO [group] (id, name, public, active, weight, status_page_id) SELECT 1, 'Core Infrastructure', 1, 1, 1, 1 WHERE NOT EXISTS (SELECT 1 FROM [group] WHERE id=1);"
    sqlite3 "$DB_PATH" "INSERT INTO [group] (id, name, public, active, weight, status_page_id) SELECT 2, 'Developer Services', 1, 1, 2, 1 WHERE NOT EXISTS (SELECT 1 FROM [group] WHERE id=2);"
    sqlite3 "$DB_PATH" "INSERT INTO [group] (id, name, public, active, weight, status_page_id) SELECT 3, 'Observability & Storage', 1, 1, 3, 1 WHERE NOT EXISTS (SELECT 1 FROM [group] WHERE id=3);"
    sqlite3 "$DB_PATH" "INSERT INTO [group] (id, name, public, active, weight, status_page_id) SELECT 4, 'Home Services', 1, 1, 4, 1 WHERE NOT EXISTS (SELECT 1 FROM [group] WHERE id=4);"
    sqlite3 "$DB_PATH" "INSERT INTO [group] (id, name, public, active, weight, status_page_id) SELECT 5, 'External Services', 1, 1, 5, 1 WHERE NOT EXISTS (SELECT 1 FROM [group] WHERE id=5);"

    # Clear and rebuild Monitor-Group mapping dynamically using monitor names
    sqlite3 "$DB_PATH" "DELETE FROM monitor_group;"
    
    # Map monitors to Core Infrastructure (Group 1)
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 1, 1 FROM monitor WHERE name='OpenShift Console';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 1, 2 FROM monitor WHERE name='ArgoCD';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 1, 3 FROM monitor WHERE name='Uptime Kuma';"
    
    # Map monitors to Developer Services (Group 2)
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 2, 1 FROM monitor WHERE name='GitLab';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 2, 2 FROM monitor WHERE name='GitLab Registry';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 2, 3 FROM monitor WHERE name='MinIO';"
    
    # Map monitors to Observability & Storage (Group 3)
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 1 FROM monitor WHERE name='Grafana';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 2 FROM monitor WHERE name='Prometheus';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 3 FROM monitor WHERE name='Alertmanager';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 4 FROM monitor WHERE name='Vault';"
    
    # Map monitors to Home Services (Group 4)
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 1 FROM monitor WHERE name='Mealie';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 2 FROM monitor WHERE name='Immich';"
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 3 FROM monitor WHERE name='Bikely Dev';"
    
    # Map monitors to External Services (Group 5)
    sqlite3 "$DB_PATH" "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 5, 1 FROM monitor WHERE name='Bikely Production';"

    echo "Monitors seeded successfully!"
