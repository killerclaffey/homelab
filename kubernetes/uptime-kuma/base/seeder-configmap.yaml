apiVersion: v1
kind: ConfigMap
metadata:
  name: uptime-kuma-seeder
  namespace: uptime-kuma
data:
  seed_monitors.sh: |
    #!/bin/sh
    DB_HOST="mariadb"
    DB_PORT="3306"
    DB_USER="kuma"
    DB_PASS="$UPTIME_KUMA_DB_PASSWORD"
    DB_NAME="kuma"

    MYSQL_CMD="mysql -h $DB_HOST -P $DB_PORT -u $DB_USER -p$DB_PASS $DB_NAME"

    echo "Starting background monitor seeder..."

    # 1. Wait for the DB connection and the monitor table to be created
    until $MYSQL_CMD -e "SELECT 1 FROM monitor LIMIT 1;" >/dev/null 2>&1; do
      echo "Waiting for Uptime Kuma database tables to be initialized..."
      sleep 5
    done

    # 2. Wait for the user to create their first admin account in the Web UI
    until [ "$($MYSQL_CMD -N -B -e "SELECT COUNT(*) FROM user;" 2>/dev/null)" -gt 0 ] 2>/dev/null; do
      echo "Waiting for the admin user to be created in the Web UI..."
      sleep 5
    done

    echo "User created. Seeding monitors..."

    seed_monitor() {
      NAME="$1"
      URL="$2"
      IGNORE_TLS="${3:-0}"
      CODES="${4:-[\"200-299\"]}"
      
      COUNT=$($MYSQL_CMD -N -B -e "SELECT COUNT(*) FROM monitor WHERE name='$NAME';")
      if [ "$COUNT" -eq 0 ]; then
        $MYSQL_CMD -e "INSERT INTO monitor (name, active, \`interval\`, url, type, ignore_tls, accepted_statuscodes_json, user_id) VALUES ('$NAME', 1, 60, '$URL', 'http', $IGNORE_TLS, '$CODES', 1);"
      else
        $MYSQL_CMD -e "UPDATE monitor SET url='$URL', \`interval\`=60, ignore_tls=$IGNORE_TLS, accepted_statuscodes_json='$CODES', user_id=1 WHERE name='$NAME';"
      fi
    }

    seed_monitor "ArgoCD" "https://argocd.apps.okd.claffey.cloud"
    seed_monitor "Mealie" "https://mealie.apps.okd.claffey.cloud"
    seed_monitor "Immich" "https://images.apps.okd.claffey.cloud"
    seed_monitor "Stirling PDF" "https://stirling-pdf.apps.okd.claffey.cloud"
    seed_monitor "WeeWX" "https://weewx.apps.okd.claffey.cloud"
    seed_monitor "GitLab" "https://gitlab.apps.okd.claffey.cloud"
    seed_monitor "Uptime Kuma" "http://localhost:3001"
    seed_monitor "Homepage" "https://homepage.apps.okd.claffey.cloud" 1
    seed_monitor "Bikely Production" "https://bikely.pro" 1
    seed_monitor "Bikely Dev" "https://devbikely.claffey.cloud" 1
    seed_monitor "Grafana" "https://grafana.apps.okd.claffey.cloud"
    seed_monitor "Prometheus" "https://prometheus.apps.okd.claffey.cloud" 1
    seed_monitor "Alertmanager" "https://alertmanager.apps.okd.claffey.cloud" 1
    seed_monitor "MinIO" "https://minio.apps.okd.claffey.cloud" 1 '["200-299","403"]'
    seed_monitor "GitLab Registry" "https://registry.apps.okd.claffey.cloud" 1
    seed_monitor "OpenShift Console" "https://console-openshift-console.apps.okd.claffey.cloud" 1
    seed_monitor "Vault" "https://vault.apps.okd.claffey.cloud" 1

    # Seed Status Page (slug: default)
    SP_COUNT=$($MYSQL_CMD -N -B -e "SELECT COUNT(*) FROM status_page WHERE slug='default';")
    if [ "$SP_COUNT" -eq 0 ]; then
      $MYSQL_CMD -e "INSERT INTO status_page (id, slug, title, description, icon, theme, published) VALUES (1, 'default', 'HomeLab Status', 'Real-time monitoring of HomeLab services and infrastructure.', '', 'dark', 1);"
    fi

    # Seed Groups
    for G_ID in 1 2 3 4 5; do
      case $G_ID in
        1) G_NAME="Core Infrastructure" ;;
        2) G_NAME="Developer Services" ;;
        3) G_NAME="Observability & Storage" ;;
        4) G_NAME="Home Services" ;;
        5) G_NAME="External Services" ;;
      esac
      G_COUNT=$($MYSQL_CMD -N -B -e "SELECT COUNT(*) FROM \`group\` WHERE id=$G_ID;")
      if [ "$G_COUNT" -eq 0 ]; then
        $MYSQL_CMD -e "INSERT INTO \`group\` (id, name, public, active, weight, status_page_id) VALUES ($G_ID, '$G_NAME', 1, 1, $G_ID, 1);"
      fi
    done

    # Clear and rebuild Monitor-Group mapping
    $MYSQL_CMD -e "DELETE FROM monitor_group;"
    
    # Map monitors to Core Infrastructure (Group 1)
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 1, 1 FROM monitor WHERE name='OpenShift Console';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 1, 2 FROM monitor WHERE name='ArgoCD';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 1, 3 FROM monitor WHERE name='Uptime Kuma';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 1, 4 FROM monitor WHERE name='Homepage';"
    
    # Map monitors to Developer Services (Group 2)
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 2, 1 FROM monitor WHERE name='GitLab';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 2, 2 FROM monitor WHERE name='GitLab Registry';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 2, 3 FROM monitor WHERE name='MinIO';"
    
    # Map monitors to Observability & Storage (Group 3)
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 1 FROM monitor WHERE name='Grafana';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 2 FROM monitor WHERE name='Prometheus';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 3 FROM monitor WHERE name='Alertmanager';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 3, 4 FROM monitor WHERE name='Vault';"
    
    # Map monitors to Home Services (Group 4)
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 1 FROM monitor WHERE name='Mealie';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 2 FROM monitor WHERE name='Immich';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 3 FROM monitor WHERE name='Bikely Dev';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 4 FROM monitor WHERE name='Stirling PDF';"
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 4, 5 FROM monitor WHERE name='WeeWX';"
    
    # Map monitors to External Services (Group 5)
    $MYSQL_CMD -e "INSERT INTO monitor_group (monitor_id, group_id, weight) SELECT id, 5, 1 FROM monitor WHERE name='Bikely Production';"

    echo "Monitors seeded successfully!"
