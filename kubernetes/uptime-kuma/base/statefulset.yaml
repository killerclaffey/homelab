apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
  labels:
    app: uptime-kuma
spec:
  replicas: 1
  serviceName: uptime-kuma
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      serviceAccountName: uptime-kuma-sa
      containers:
        - name: uptime-kuma
          image: docker.io/louislam/uptime-kuma:2-rootless
          command:
            - /bin/sh
            - -c
            - |
              sh /opt/seeder/seed_monitors.sh &
              exec node server/server.js
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "256Mi"
              cpu: "15m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          volumeMounts:
            - name: uptime-kuma-pvc
              mountPath: /app/data
            - name: seeder-vol
              mountPath: /opt/seeder
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: uptime-kuma-pvc
          persistentVolumeClaim:
            claimName: uptime-kuma
        - name: seeder-vol
          configMap:
            name: uptime-kuma-seeder
