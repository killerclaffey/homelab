apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jampage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: default
  source:
    repoURL: https://gitlab.apps.okd.claffey.cloud/rclaffey/homelab.git
    targetRevision: HEAD
    path: kubernetes/jampage/base
  destination:
    server: https://kubernetes.default.svc
    namespace: jampage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
      - ServerSideApply=true
