apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tns-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/instance: argocd
spec:
  destination:
    namespace: tns-csi
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: tns-csi-driver
    repoURL: registry-1.docker.io/bfenski
    targetRevision: "0.17.6"
    helm:
      values: |
        truenas:
          url: "wss://10.0.20.2/api/current"
          apiKey: "unused-see-existingSecret"
          skipTLSVerify: true
          existingSecret: "tns-csi-secret"
        openshift:
          enabled: true
        storageClasses:
          - name: tns-nfs-nvme
            enabled: true
            protocol: nfs
            pool: "Nvme"
            server: "10.0.20.2"
            mountOptions:
              - vers=4.0
              - hard
              - timeo=150
              - retrans=3
              - noresvport
          - name: tns-nvmeof-nvme
            enabled: true
            protocol: nvmeof
            pool: "Nvme"
            server: "10.0.20.2"
            subsystemNQN: "nqn.2011-06.com.truenas:uuid:6fc676c7-0e1b-4155-981c-47acefc1f825"
  ignoreDifferences:
    - group: storage.k8s.io
      kind: StorageClass
      jsonPointers:
        - /metadata/annotations
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/template/metadata/annotations
        - /spec/template/spec/containers/0/securityContext
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
      - CreateNamespace=true
