apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/instance: argocd
spec:
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.20.4
      helm:
        values: |
          installCRDs: true
          securityContext:
            runAsUser: null
          webhook:
            securityContext:
              runAsUser: null
          certController:
            securityContext:
              runAsUser: null
    - repoURL: https://gitlab.apps.okd.claffey.cloud/rclaffey/homelab.git
      targetRevision: HEAD
      path: kubernetes/external-secrets/overlays/okd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - RespectIgnoreDifferences=true
    - ServerSideApply=true
    - CreateNamespace=true
