apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bikely-db
  namespace: bikely-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/instance: bikely-dev
    app.kubernetes.io/name: bikely-db
spec:
  enablePDB: false
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie@sha256:c437b7c6c00aa7e66f5d6de1dd83602391fdebd4ff776ffb1ab7aaba5e7351ad"
  instances: 1
  imagePullPolicy: IfNotPresent
  logLevel: info
  primaryUpdateMethod: restart
  primaryUpdateStrategy: unsupervised
  postgresUID: 26
  postgresGID: 999
  bootstrap:
    initdb:
      database: fitness_app
      owner: fitness_user
      secret:
        name: bikely-db-owner
      postInitSQL:
        - GRANT ALL ON SCHEMA public TO fitness_user;
  enableSuperuserAccess: false
  monitoring:
    enablePodMonitor: false
  storage:
    storageClass: tns-nvmeof-nvme
    size: 25Gi
  walStorage:
    storageClass: tns-nvmeof-nvme
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  seccompProfile:
    type: RuntimeDefault
  backup:
    target: prefer-standby
    volumeSnapshot:
      className: tns-nvmeof-nvme-snapshot
      walClassName: tns-nvmeof-nvme-snapshot
      snapshotOwnerReference: backup
      online: true
      onlineConfiguration:
        immediateCheckpoint: false
        waitForArchive: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: bikely-dev-minio-store
        serverName: bikely-dev-pg18
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bikely-dev-cnpg-scc
  labels:
    app.kubernetes.io/instance: bikely-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-postgres-scc-use
subjects:
  - kind: ServiceAccount
    name: bikely-db
    namespace: bikely-dev
