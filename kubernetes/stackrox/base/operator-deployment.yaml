---
# Source: stackrox-operator/templates/manager/manager.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: stackrox-operator
    control-plane: controller-manager
  name: stackrox-operator-controller-manager
  namespace: stackrox
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: stackrox-operator
      control-plane: controller-manager
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app: stackrox-operator
        control-plane: controller-manager
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      containers:
        - args:
            - --metrics-bind-address=0.0.0.0:8443
            - --health-probe-bind-address=:8081
            - --leader-elect
          env:
            - name: RELATED_IMAGE_MAIN
            - name: RELATED_IMAGE_COLLECTOR
            - name: RELATED_IMAGE_FACT
            - name: RELATED_IMAGE_ROXCTL
            - name: RELATED_IMAGE_CENTRAL_DB
            - name: RELATED_IMAGE_SCANNER_V4_DB
            - name: RELATED_IMAGE_SCANNER_V4
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: manager
                  divisor: "0"
                  resource: limits.memory
          image: "quay.io/stackrox-io/stackrox-operator:5.0.0@sha256:ed30ab7a5e2a6d57ee734a86082e6fa6f8fc955124e8f8f31465c6b4dd6d9802"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: health
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 1
          name: manager
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: health
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 200m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      # Server-populated defaults spelled out explicitly so ArgoCD's
      # ServerSideApply diff stays clean (matches live state).
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
      serviceAccount: stackrox-operator-controller-manager
      serviceAccountName: stackrox-operator-controller-manager
      terminationGracePeriodSeconds: 10
