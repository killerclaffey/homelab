configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      config:
        region: us-east-1
        s3ForcePathStyle: true
        s3Url: http://gitlab-minio-svc.gitlab-system.svc.cluster.local:9000
  volumeSnapshotLocation: []
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.10.1
    volumeMounts:
      - mountPath: /target
        name: plugins
credentials:
  useSecret: true
  name: velero-credentials
deployNodeAgent: false
