apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - velero-manifests.yaml
  - schedule-daily.yaml
patches:
  - target:
      kind: BackupStorageLocation
      name: default
    patch: |-
      apiVersion: velero.io/v1
      kind: BackupStorageLocation
      metadata:
        name: default
        annotations:
          argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
