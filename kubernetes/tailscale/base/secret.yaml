apiVersion: v1
kind: Secret
metadata:
  name: tailscale-auth
  namespace: tailscale
type: Opaque
stringData:
  # Generate an auth key in Tailscale Admin Console:
  # Settings -> Keys -> Generate auth key (reusable or ephemeral, tag:k8s recommended)
  # Apply live on cluster with:
  # oc create secret generic tailscale-auth -n tailscale --from-literal=TS_AUTHKEY="tskey-auth-..." --dry-run=client -o yaml | oc apply -f -
  TS_AUTHKEY: "REPLACE_ME"
