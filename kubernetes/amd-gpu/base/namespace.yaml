apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    openshift.io/description: ROCm k8s-device-plugin (amd.com/gpu) and node labeller
    openshift.io/display-name: AMD GPU Device Plugin
  labels:
    kubernetes.io/metadata.name: amd-gpu
    # Device plugin + labeller DaemonSets mount hostPath (/sys, /dev,
    # /var/lib/kubelet/device-plugins), which PSA only allows at "privileged".
    # Disable OpenShift's PSA label syncer so these stay pinned.
    security.openshift.io/scc.podSecurityLabelSync: "false"
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: latest
  name: amd-gpu
