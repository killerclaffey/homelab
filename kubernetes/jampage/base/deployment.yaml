apiVersion: apps/v1
kind: Deployment
metadata:
  name: jampage
  namespace: jampage
  labels:
    app: jampage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jampage
  template:
    metadata:
      labels:
        app: jampage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      initContainers:
        - name: init-config
          image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
          command:
            - /bin/sh
            - -c
            - |
              echo "Copying .next build cache to writable volume..."
              cp -r /app/.next/. /writable-next/
              rm -f /writable-next/server/pages/en.html /writable-next/server/pages/en.json /writable-next/server/pages/index.html /writable-next/server/pages/index.json
              echo "Initializing writable config directory from skeleton..."
              cp -r /app/src/skeleton/. /app/config/
              cp /app/config-templates/bookmarks/bookmarks.yaml /app/config/
              cp /app/config-templates/services/services.yaml /app/config/
              cp /app/config-templates/widgets/widgets.yaml /app/config/
              cp /app/config-templates/settings/settings.yaml /app/config/
              mkdir -p /app/config/logs
              echo "Init complete."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: writable-next
              mountPath: /writable-next
            - name: config-dir
              mountPath: /app/config
            - name: config-bookmarks
              mountPath: /app/config-templates/bookmarks
            - name: config-services
              mountPath: /app/config-templates/services
            - name: config-widgets
              mountPath: /app/config-templates/widgets
            - name: config-settings
              mountPath: /app/config-templates/settings
      containers:
        - name: jampage
          image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: jampage.apps.okd.claffey.cloud,jampage.apps.okd.claffey.cloud:443
          volumeMounts:
            - name: writable-next
              mountPath: /app/.next
            - name: config-dir
              mountPath: /app/config
      volumes:
        - name: writable-next
          emptyDir: {}
        - name: config-dir
          emptyDir: {}
        - name: config-bookmarks
          configMap:
            name: jampage-bookmarks
        - name: config-services
          configMap:
            name: jampage-services
        - name: config-widgets
          configMap:
            name: jampage-widgets
        - name: config-settings
          configMap:
            name: jampage-settings
