apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: stirling-pdf
    app.kubernetes.io/name: stirling-pdf
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: stirling-pdf
      app.kubernetes.io/name: stirling-pdf
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: stirling-pdf
        app.kubernetes.io/name: stirling-pdf
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      containers:
        - name: stirling-pdf
          image: docker.io/stirlingtools/stirling-pdf:3.1.0@sha256:0b33f7ed24912de5b65b90ada2b1b42e2abc24f2029f8692adc944a148522f74
          command: ["/bin/bash", "/custom/stirling-init.sh"]
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SYSTEM_DEFAULTLOCALE
              value: "en-US"
            - name: SECURITY_ENABLELOGIN
              value: "true"
            - name: DOCKER_ENABLE_SECURITY
              value: "true"
            - name: UI_APPNAME
              value: "Stirling PDF"
          resources:
            requests:
              cpu: 50m
              memory: 1536Mi
            limits:
              cpu: 1000m
              memory: 3072Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 30
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: http
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /configs
              name: configs
            - mountPath: /logs
              name: logs
            - mountPath: /customFiles
              name: custom-files
            - mountPath: /pipeline
              name: pipeline
            - mountPath: /tmp
              name: tmp
            - mountPath: /custom
              name: init-script
      securityContext:
        runAsNonRoot: true
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: stirling-pdf-configs
        - name: logs
          emptyDir: {}
        - name: custom-files
          emptyDir: {}
        - name: pipeline
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init-script
          configMap:
            defaultMode: 0777
            name: stirling-pdf-init
