apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: stirling-pdf
    app.kubernetes.io/name: stirling-pdf
  name: stirling-pdf
  namespace: stirling-pdf
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: stirling-pdf
      app.kubernetes.io/name: stirling-pdf
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: stirling-pdf
        app.kubernetes.io/name: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: docker.io/stirlingtools/stirling-pdf:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: SYSTEM_DEFAULTLOCALE
              value: "en-US"
            - name: SECURITY_ENABLELOGIN
              value: "false"
            - name: UI_APPNAME
              value: "Stirling PDF"
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 30
            periodSeconds: 5
            successThreshold: 1
            tcpSocket:
              port: 8080
            timeoutSeconds: 1
          volumeMounts:
            - mountPath: /configs
              name: configs
            - mountPath: /logs
              name: logs
            - mountPath: /customFiles
              name: custom-files
            - mountPath: /pipeline
              name: pipeline
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: stirling-pdf-configs
        - name: logs
          emptyDir: {}
        - name: custom-files
          emptyDir: {}
        - name: pipeline
          emptyDir: {}
        - name: tmp
          emptyDir: {}
