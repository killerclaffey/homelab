apiVersion: v1
kind: ConfigMap
metadata:
  name: stirling-pdf-init
  namespace: stirling-pdf
data:
  stirling-init.sh: |
    #!/bin/bash
    set -e

    # Create temporary directories for runtime
    mkdir -p /tmp/stirling-pdf
    mkdir -p /tmp/stirling-pdf/libre
    
    export TMPDIR=/tmp/stirling-pdf
    export STIRLING_TEMPFILES_DIRECTORY=/tmp/stirling-pdf
    export TEMP=/tmp/stirling-pdf
    export TMP=/tmp/stirling-pdf
    export SAL_TMP=/tmp/stirling-pdf/libre

    # === LD_LIBRARY_PATH ===
    ARCH=$(uname -m)
    case "$ARCH" in
      x86_64)
        [ -d /usr/lib/x86_64-linux-gnu ] && export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        ;;
      aarch64)
        [ -d /usr/lib/aarch64-linux-gnu ] && export LD_LIBRARY_PATH="/usr/lib/aarch64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        ;;
    esac

    if [ -d /usr/lib/libreoffice/program ]; then
      export LD_LIBRARY_PATH="/usr/lib/libreoffice/program${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    fi

    # === Python PATH ===
    python_site_dir() {
      local venv_dir="$1"
      local python_bin="$venv_dir/bin/python"
      if [ -x "$python_bin" ]; then
        local py_tag
        if py_tag="$("$python_bin" -c 'import sys; print(f"python{sys.version_info.major}.{sys.version_info.minor}")' 2>/dev/null)" \
           && [ -n "$py_tag" ] \
           && [ -d "$venv_dir/lib/$py_tag/site-packages" ]; then
          printf '%s' "$venv_dir/lib/$py_tag/site-packages"
        fi
      fi
    }

    append_env_path() {
      local target="$1" current="$2" separator=":"
      if [ -d "$target" ] && [[ ":${current}:" != *":${target}:"* ]]; then
        if [ -n "$current" ]; then
          printf '%s' "${target}${separator}${current}"
        else
          printf '%s' "${target}"
        fi
      else
        printf '%s' "$current"
      fi
    }

    for dir in /opt/venv/bin /opt/unoserver-venv/bin; do
      PATH="$(append_env_path "$dir" "$PATH")"
    done
    export PATH

    PYTHON_PATH_ENTRIES=()
    for venv in /opt/venv /opt/unoserver-venv; do
      if [ -d "$venv" ]; then
        site_dir="$(python_site_dir "$venv")"
        [ -n "${site_dir:-}" ] && PYTHON_PATH_ENTRIES+=("$site_dir")
      fi
    done
    if [ ${#PYTHON_PATH_ENTRIES[@]} -gt 0 ]; then
      PYTHONPATH="$(IFS=:; printf '%s' "${PYTHON_PATH_ENTRIES[*]}")${PYTHONPATH:+:$PYTHONPATH}"
      export PYTHONPATH
    fi

    # === Tesseract OCR ===
    export TESSDATA_PREFIX="/usr/share/tesseract-ocr/5/tessdata"

    # === Start Xvfb (Virtual display for LibreOffice) ===
    if command -v Xvfb >/dev/null 2>&1; then
      echo "Starting Xvfb..."
      Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset > /dev/null 2>&1 &
      export DISPLAY=:99
      sleep 1
    fi

    # === Start Unoserver ===
    UNOSERVER_BIN="$(command -v unoserver || true)"
    if [ -n "$UNOSERVER_BIN" ]; then
      echo "Starting unoserver..."
      "$UNOSERVER_BIN" --addr 127.0.0.1 --port 2003 --user-installation "file:///tmp/stirling-pdf/libre" >/dev/null 2>&1 &
    fi

    # === Start Java Application ===
    echo "Starting Stirling PDF..."
    exec java -Dfile.encoding=UTF-8 -Djava.io.tmpdir=/tmp/stirling-pdf -cp "/app/app.jar:/app/lib/*" stirling.software.SPDF.SPDFApplication
