apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-credentials
  namespace: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: renovate-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # GitLab project access token — needs `api` scope (Renovate opens MRs)
    - secretKey: GITLAB_TOKEN
      remoteRef:
        key: homelab/renovate/common
        property: gitlab-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    # GitHub token for release lookups / changelog fetching
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: homelab/renovate/common
        property: github-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
