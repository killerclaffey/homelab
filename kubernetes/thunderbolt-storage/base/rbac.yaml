apiVersion: v1
kind: ServiceAccount
metadata:
  name: thunderbolt-storage-sa
  namespace: thunderbolt-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: thunderbolt-storage-privileged-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: thunderbolt-storage-sa
    namespace: thunderbolt-storage
