apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-09-08T21:22:00-04:00"
      labels:
        app: homepage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      schedulerName: default-scheduler
      initContainers:
        - name: init-config
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          command:
            - /bin/sh
            - -c
            - |
              echo "Copying .next build cache to writable volume..."
              cp -r /app/.next/. /writable-next/
              echo "Initializing writable config directory from skeleton..."
              cp -r /app/src/skeleton/. /app/config/
              cp /app/config-templates/bookmarks/bookmarks.yaml /app/config/
              cp /app/config-templates/services/services.yaml /app/config/
              cp /app/config-templates/widgets/widgets.yaml /app/config/
              cp /app/config-templates/settings/settings.yaml /app/config/
              mkdir -p /app/config/logs
              echo "Init complete."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: writable-next
              mountPath: /writable-next
            - name: config-dir
              mountPath: /app/config
            - name: config-bookmarks
              mountPath: /app/config-templates/bookmarks
            - name: config-services
              mountPath: /app/config-templates/services
            - name: config-widgets
              mountPath: /app/config-templates/widgets
            - name: config-settings
              mountPath: /app/config-templates/settings
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.8.0@sha256:019d8f063a7299e7c1c51ee4a70b692291809af3244894fbec2c2ac7d1f71b18
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.apps.okd.claffey.cloud
          volumeMounts:
            - name: writable-next
              mountPath: /app/.next
            - name: config-dir
              mountPath: /app/config
      volumes:
        - name: writable-next
          emptyDir: {}
        - name: config-dir
          emptyDir: {}
        - name: config-bookmarks
          configMap:
            name: homepage-bookmarks
        - name: config-services
          configMap:
            name: homepage-services
        - name: config-widgets
          configMap:
            name: homepage-widgets
        - name: config-settings
          configMap:
            name: homepage-settings
