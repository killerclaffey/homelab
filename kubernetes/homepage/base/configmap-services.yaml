apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-services
  namespace: homepage
data:
  services.yaml: |
    - Core Cluster:
        - OpenShift Console:
            icon: si-redhatopenshift
            href: https://console-openshift-console.apps.okd.claffey.cloud
            description: OKD Cluster Management Console
        - ArgoCD:
            icon: sh-argo-cd
            href: https://argocd.apps.okd.claffey.cloud
            description: GitOps Continuous Delivery
        - Vault:
            icon: sh-hashicorp-vault
            href: https://vault.apps.okd.claffey.cloud
            description: Secrets Management Service
        - StackRox:
            icon: mdi-shield-check
            href: https://stackrox.apps.okd.claffey.cloud
            description: Kubernetes Cluster Security Platform
    - Developer Tools:
        - GitLab:
            icon: sh-gitlab
            href: https://gitlab.apps.okd.claffey.cloud
            description: Self-hosted Git & CI/CD
        - GitLab Registry:
            icon: si-docker
            href: https://registry.apps.okd.claffey.cloud
            description: Container Image Registry
        - GitLab MinIO Console:
            icon: sh-minio
            href: https://minio.apps.okd.claffey.cloud
            description: Object Storage Management
        - MinIO TrueNAS:
            icon: sh-minio
            href: https://minio.claffey.cloud:30213
            description: TrueNAS Object Storage Console
    - Observability:
        - Grafana:
            icon: sh-grafana
            href: https://grafana.apps.okd.claffey.cloud
            description: Dashboards & Visualization
        - Prometheus:
            icon: sh-prometheus
            href: https://prometheus.apps.okd.claffey.cloud
            description: Metrics & Monitoring
        - Alertmanager:
            icon: sh-prometheus
            href: https://alertmanager.apps.okd.claffey.cloud
            description: Alert Notification Routing
        - Uptime Kuma:
            icon: sh-uptime-kuma
            href: https://uptime-kuma.apps.okd.claffey.cloud
            description: Service Monitoring & Alerts
        - Status Dashboard:
            icon: sh-uptime-kuma
            href: https://uptime-kuma.apps.okd.claffey.cloud/status/default
            description: Public Service Status Page
        - Thanos Querier:
            icon: sh-prometheus
            href: https://thanos-querier-openshift-monitoring.apps.okd.claffey.cloud
            description: Global Metrics Query Engine
        - Prometheus (Platform):
            icon: sh-prometheus
            href: https://prometheus-k8s-openshift-monitoring.apps.okd.claffey.cloud
            description: OKD Platform Monitoring Console
        - Alertmanager (Platform):
            icon: sh-prometheus
            href: https://alertmanager-main-openshift-monitoring.apps.okd.claffey.cloud
            description: OKD Platform Alert Notifications
    - Home Applications:
        - Home Assistant:
            icon: sh-home-assistant
            href: https://home.apps.okd.claffey.cloud
            description: Home Automation & Integration Platform
        - Music Assistant:
            icon: mdi-music
            href: https://music.apps.okd.claffey.cloud
            description: Multi-room Music Streaming Hub
        - Mealie:
            icon: sh-mealie
            href: https://mealie.apps.okd.claffey.cloud
            description: Recipe Manager & Meal Planner
        - Immich:
            icon: sh-immich
            href: https://images.apps.okd.claffey.cloud
            description: Photos & Videos Backup
        - Stirling PDF:
            icon: sh-stirling-pdf
            href: https://stirling-pdf.apps.okd.claffey.cloud
            description: Local PDF Manipulation Suite
        - Bikely Production:
            icon: si-googlechrome
            href: https://bikely.pro
            description: Bikely Production Website
        - Bikely Dev:
            icon: si-googlechrome
            href: https://devbikely.claffey.cloud
            description: Bikely Development Environment
    - Network & Storage:
        - OPNsense:
            icon: si-opnsense
            href: https://firewall.claffey.cloud:4443/
            description: OPNsense Firewall & Router
        - TrueNAS:
            icon: si-truenas
            href: https://nas.claffey.cloud
            description: TrueNAS Scale Storage GUI
