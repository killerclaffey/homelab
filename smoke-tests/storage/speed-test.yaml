# ==============================================================================
# STORAGE SPEED TEST BENCHMARK (THOROUGH SUITE)
# ==============================================================================
#
# This file contains a thorough sequential storage benchmark comparing all four 
# TrueNAS storage classes side-by-side. 
#
# It runs 4 iterations of each test (seq/rand read/write across 4k/1M blocksizes)
# and calculates the exact average throughput (MB/s) and IOPS for each backend.
#
# HOW TO RUN THE SPEED TESTS:
#
# 1. Apply the manifest:
#    oc apply -f smoke-tests/storage/speed-test.yaml
#
# 2. Watch the Job progress until complete (takes ~2-3 minutes):
#    oc get jobs -n smoke-test -w
#
# 3. View the final storage performance average report:
#    oc logs job/storage-speed-test -n smoke-test
#
# 4. Clean up all speed test resources:
#    oc delete -f smoke-tests/storage/speed-test.yaml
#
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: smoke-test
  labels:
    security.openshift.io/scc.podSecurityLabelSync: "false"
    pod-security.kubernetes.io/enforce: privileged

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-speed-test-script
  namespace: smoke-test
data:
  benchmark.sh: |
    #!/bin/sh
    backends="truenas-nfs truenas-iscsi tns-nfs tns-nvmeof"
    iterations=4

    echo "=== Starting Thorough Storage Benchmark (OpenShift-Native) ==="

    # Initialize reports
    report_seq_write=""
    report_seq_read=""
    report_rand_write=""
    report_rand_read=""

    run_test_suite() {
      test_label=$1
      rw=$2
      bs=$3
      size=$4
      run_time=$5
      section=$6
      
      echo "" >&2
      echo "------------------------------------------------------------" >&2
      echo " Running $test_label ($iterations iterations)..." >&2
      echo "------------------------------------------------------------" >&2
      
      # We will build a table row by row for each backend
      row_data=""
      
      for backend in $backends; do
        echo "  Testing backend: $backend..." >&2
        
        total_bw=0
        total_iops=0
        success_runs=0
        
        for i in $(seq 1 $iterations); do
          filename="/mnt/$backend/speedtest.bin"
          json_file="/tmp/fio_result.json"
          rm -f "$json_file"
          
          # Run FIO with JSON output
          fio --name=benchmark \
              --rw="$rw" \
              --bs="$bs" \
              --size="$size" \
              --filename="$filename" \
              --runtime="$run_time" \
              --time_based \
              --direct=1 \
              --ioengine=libaio \
              --output-format=json > "$json_file" 2>/dev/null
              
          if [ -f "$json_file" ] && grep -q "\"jobs\"" "$json_file"; then
            # Extract bw_bytes and iops
            bw_bytes=$(sed -n "/\"$section\" : {/,/}/p" "$json_file" | grep "\"bw_bytes\"" | head -n 1 | awk -F: '{print $2}' | tr -d ' ,')
            iops=$(sed -n "/\"$section\" : {/,/}/p" "$json_file" | grep "\"iops\"" | head -n 1 | awk -F: '{print $2}' | tr -d ' ,')
            
            if [ ! -z "$bw_bytes" ] && [ ! -z "$iops" ]; then
              # Convert bw_bytes to MB/s (floating point division in awk)
              bw_mb=$(awk -v bytes="$bw_bytes" 'BEGIN {print bytes / 1024 / 1024}')
              
              # Add to totals
              total_bw=$(awk -v t="$total_bw" -v b="$bw_mb" 'BEGIN {print t + b}')
              total_iops=$(awk -v t="$total_iops" -v i="$iops" 'BEGIN {print t + i}')
              success_runs=$((success_runs + 1))
            fi
          else
            echo "    Run $i failed to produce valid FIO JSON output." >&2
          fi
          
          rm -f "$filename" "$json_file"
          sleep 0.2
        done
        
        if [ "$success_runs" -gt 0 ]; then
          avg_bw=$(awk -v t="$total_bw" -v r="$success_runs" 'BEGIN {printf "%.2f", t / r}')
          avg_iops=$(awk -v t="$total_iops" -v r="$success_runs" 'BEGIN {printf "%.1f", t / r}')
        else
          avg_bw="0.00"
          avg_iops="0.0"
        fi
        
        echo "    Average: $avg_bw MB/s ($avg_iops IOPS)" >&2
        row_data="${row_data}| $backend | $avg_bw MB/s | $avg_iops |\n"
      done
      
      # Return row data
      printf "$row_data"
    }

    seq_write_rows=$(run_test_suite "Seq Write (1M)" "write" "1M" "128M" 5 "write")
    seq_read_rows=$(run_test_suite "Seq Read (1M)" "read" "1M" "128M" 5 "read")
    rand_write_rows=$(run_test_suite "Rand Write (4k)" "randwrite" "4k" "64M" 5 "write")
    rand_read_rows=$(run_test_suite "Rand Read (4k)" "randread" "4k" "64M" 5 "read")

    echo ""
    echo "============================================================"
    echo "      FINAL BENCHMARK AVERAGES REPORT (4 RUNS EACH)"
    echo "============================================================"
    echo ""
    echo "### Seq Write (1M)"
    echo "| Storage Class | Avg Throughput (MB/s) | Avg IOPS |"
    echo "| :--- | :---: | :---: |"
    printf "$seq_write_rows"
    echo ""
    echo "### Seq Read (1M)"
    echo "| Storage Class | Avg Throughput (MB/s) | Avg IOPS |"
    echo "| :--- | :---: | :---: |"
    printf "$seq_read_rows"
    echo ""
    echo "### Rand Write (4k)"
    echo "| Storage Class | Avg Throughput (MB/s) | Avg IOPS |"
    echo "| :--- | :---: | :---: |"
    printf "$rand_write_rows"
    echo ""
    echo "### Rand Read (4k)"
    echo "| Storage Class | Avg Throughput (MB/s) | Avg IOPS |"
    echo "| :--- | :---: | :---: |"
    printf "$rand_read_rows"
    echo ""

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-speed-truenas-nfs
  namespace: smoke-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs-bulk
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-speed-truenas-iscsi
  namespace: smoke-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-iscsi-nvme
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-speed-tns-nfs
  namespace: smoke-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tns-nfs-nvme
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-speed-tns-nvmeof
  namespace: smoke-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: tns-nvmeof-nvme
  resources:
    requests:
      storage: 5Gi

---
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-speed-test
  namespace: smoke-test
spec:
  template:
    metadata:
      labels:
        app: storage-speed-test
    spec:
      restartPolicy: Never
      containers:
      - name: fio-tester
        image: docker.io/ljishen/fio:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            sh /app/benchmark.sh
        volumeMounts:
        - name: mount-truenas-nfs
          mountPath: /mnt/truenas-nfs
        - name: mount-truenas-iscsi
          mountPath: /mnt/truenas-iscsi
        - name: mount-tns-nfs
          mountPath: /mnt/tns-nfs
        - name: mount-tns-nvmeof
          mountPath: /mnt/tns-nvmeof
        - name: script-vol
          mountPath: /app
      volumes:
      - name: mount-truenas-nfs
        persistentVolumeClaim:
          claimName: pvc-speed-truenas-nfs
      - name: mount-truenas-iscsi
        persistentVolumeClaim:
          claimName: pvc-speed-truenas-iscsi
      - name: mount-tns-nfs
        persistentVolumeClaim:
          claimName: pvc-speed-tns-nfs
      - name: mount-tns-nvmeof
        persistentVolumeClaim:
          claimName: pvc-speed-tns-nvmeof
      - name: script-vol
        configMap:
          name: storage-speed-test-script
